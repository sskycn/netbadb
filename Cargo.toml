[workspace]
resolver = "2"
members = [
    "crates/netbadb-types",
    "crates/netbadb-schema",
    "crates/netbadb-parser",
    "crates/netbadb-hir",
    "crates/netbadb-rel",
    "crates/netbadb-index",
    "crates/netbadb-compiler",
    "crates/netbadb-planner",
    "crates/netbadb-storage",
    "crates/netbadb-executor",
    "crates/netbadb-core",
    "crates/netbadb-protocol",
    "crates/netbadb-client",
    "crates/netbadb-inspect",
    "crates/netbadb-server",
    "crates/netbadb-codegen",
    "cmd/netbadb",
    "cmd/netbadbd",
    "sdk/rust",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.85"

[workspace.dependencies]
crc32c = "0.6.8"
rustls = { version = "0.23.35", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"

[workspace.lints.clippy]
all = "warn"

[workspace.lints.rust]
unsafe_code = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
