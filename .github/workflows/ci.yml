name: CI

on:
  push:
  pull_request:

jobs:
  capability-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Record checkout and toolchain
        run: |
          echo "current=$(git rev-parse HEAD)"
          echo "baseline=$(git rev-parse b36f784584132ce21fe24ed840da681613487881)"
          rustc --version
          cargo --version
      - name: Fetch current and baseline dependencies
        run: |
          cargo fetch --locked
          baseline_dir=$(mktemp -d)
          trap 'rm -rf "$baseline_dir"' EXIT
          git archive b36f784584132ce21fe24ed840da681613487881 | tar -xf - -C "$baseline_dir"
          cargo fetch --locked --manifest-path "$baseline_dir/Cargo.toml"
      - name: Check capability dependency boundaries and checker fixtures
        run: |
          python3 scripts/test-capability-deps.py
          python3 scripts/check-capability-deps.py
      - name: Check independent consumers
        run: |
          scripts/check-independent-consumers.sh
          python3 scripts/check-minimal-consumers.py
      - name: Check baseline storage compatibility
        run: scripts/check-baseline-change-compatibility.sh

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo check -p netbadb-sdk --no-default-features
      - run: cargo check -p netbadb-sdk --no-default-features --features remote
      - run: cargo check -p netbadb-sdk --all-features
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run A3 ownership regressions on Linux local storage
        run: |
          cargo test -p netbadb-core --test lsm mixed_admission
          cargo test -p netbadb-core --test lsm completed_mixed_create_journal_reopens_with_lsm_participant
          cargo test -p netbadb-core --lib mixed_create_crash_recovery_respects_the_original_decision
          cargo test -p netbadb-core --lib mixed_create_pending_replay_refuses_busy_lsm_and_staged_heap_without_writes
          cargo test -p netbadb-core --lib mixed_create_replay_holds_all_owners_between_admission_and_recovery
          cargo test -p netbadb-core --lib mixed_create_replay_restarts_after_a_second_crash_during_promotion
          cargo test -p netbadb-core --lib mixed_create_replay_rejects_wrong_staged_owner_before_recovery_writes
          cargo test -p netbadb-core --lib mixed_second_create_replays_after_a_settled_create_history
          cargo test -p netbadb-core --lib mixed_legacy_create_crash_recovery_respects_the_original_decision
          cargo test -p netbadb-core --lib mixed_legacy_create_replays_all_heap_lsm_commit_participants
          cargo test -p netbadb-core --lib mixed_legacy_create_refuses_busy_participants_before_replay_writes
          cargo test -p netbadb-core --lib mixed_create_history_accepts_both_legal_journal_encodings
          cargo test -p netbadb-core --test lsm mixed_invalid_participant_rejects_before_coordinator_tail_repair
          cargo test -p netbadb-core --test lsm mixed_without_coordinator_checks_all_recovery_inputs_before_open
          cargo test -p netbadb-core --test lsm shared_catalog_rejects_second_core_with_subset_expectation
          cargo test -p netbadb-core --test lsm metadata_ownership_survives_database_drop_with_live_transaction
          cargo test -p netbadb-core --lib mixed_handoff_holds_both_engines_before_recovery
          cargo test -p netbadb-core --lib mixed_lsm_root_replacement_after_discovery_fails_before_recovery
      - run: cargo test --workspace

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.85.0
      - run: cargo check --workspace --all-targets
      - run: cargo check -p netbadb-sdk --no-default-features --features remote

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go/go.mod
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Check generated Go SDK source
        run: ./scripts/check-generated-sdk.sh
      - name: Check Go formatting
        working-directory: sdk/go
        run: test -z "$(gofmt -l .)"
      - name: Test Go client
        working-directory: sdk/go
        run: go test ./...
      - name: Vet Go client
        working-directory: sdk/go
        run: go vet ./...
      - name: Test Go and Rust interoperability
        run: ./scripts/test-go-sdk.sh
