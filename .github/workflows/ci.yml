name: CI

on:
  push:
  pull_request:

jobs:
  capability-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Record checkout and toolchain
        run: |
          echo "current=$(git rev-parse HEAD)"
          echo "baseline=$(git rev-parse b36f784584132ce21fe24ed840da681613487881)"
          rustc --version
          cargo --version
      - name: Fetch current and baseline dependencies
        run: |
          cargo fetch --locked
          baseline_dir=$(mktemp -d)
          trap 'rm -rf "$baseline_dir"' EXIT
          git archive b36f784584132ce21fe24ed840da681613487881 | tar -xf - -C "$baseline_dir"
          cargo fetch --locked --manifest-path "$baseline_dir/Cargo.toml"
      - name: Check capability dependency boundaries and checker fixtures
        run: |
          python3 scripts/test-capability-deps.py
          python3 scripts/check-capability-deps.py
      - name: Check independent consumers
        run: |
          scripts/check-independent-consumers.sh
          python3 scripts/check-minimal-consumers.py
      - name: Check baseline storage compatibility
        run: scripts/check-baseline-change-compatibility.sh

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo check -p netbadb-sdk --no-default-features
      - run: cargo check -p netbadb-sdk --no-default-features --features remote
      - run: cargo check -p netbadb-sdk --all-features
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.85.0
      - run: cargo check --workspace --all-targets
      - run: cargo check -p netbadb-sdk --no-default-features --features remote

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go/go.mod
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Check generated Go SDK source
        run: ./scripts/check-generated-sdk.sh
      - name: Check Go formatting
        working-directory: sdk/go
        run: test -z "$(gofmt -l .)"
      - name: Test Go client
        working-directory: sdk/go
        run: go test ./...
      - name: Vet Go client
        working-directory: sdk/go
        run: go vet ./...
      - name: Test Go and Rust interoperability
        run: ./scripts/test-go-sdk.sh
